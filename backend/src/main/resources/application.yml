spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/customers_db
    username: app
    password: app
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    url: jdbc:postgresql://127.0.0.1:5432/customers_db
    user: app
    password: app
    schemas: public

server:
  port: 8080
